[tools]
go = "1.26.9"
node = "22.22.1"

[tasks.up]
description = "Start Attune with frontend hot reload and Go rebuilds"
run = "./scripts/dev-up.sh"

[tasks.down]
description = "Stop the managed development app and frontend"
run = "./scripts/dev-down.sh"

[tasks.dev]
description = "Run the browser-only preview"
run = ["npm --prefix frontend ci", "npm --prefix frontend run dev"]
env = { VITE_ATTUNE_PREVIEW = "1" }

[tasks._frontend-build]
hide = true
run = ["npm --prefix frontend ci", "npm --prefix frontend run build"]

[tasks.test]
description = "Run Go tests with the race detector"
run = [{ task = "_frontend-build" }, "go test -race -tags=gtk3 ./..."]
env = { CGO_ENABLED = "1" }

[tasks.lint]
description = "Check Go formatting, Go vet, and TypeScript"
  run = [
  { task = "_frontend-build" },
  "node scripts/check-gofmt.mjs",
  "go vet -tags=gtk3 ./...",
  "npm --prefix frontend exec -- tsc --noEmit --project frontend/tsconfig.json",
]
env = { CGO_ENABLED = "1" }

[tasks.build]
description = "Build the desktop app for the current platform"
run = [
  "scripts/fetch-kindling.sh",
  '''version=$(node -p "require('./frontend/package.json').version"); if [ "$(go env GOOS)" = darwin ]; then ATTUNE_VERSION="$version" scripts/build.sh; else scripts/build-release.sh "$version" gtk3; fi''',
]
  run_windows = '''pwsh -NoProfile -Command "& { & './scripts/fetch-kindling.ps1'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; $version = (Get-Content 'frontend/package.json' -Raw | ConvertFrom-Json).version; & './scripts/build-release.ps1' -Version $version }"'''
