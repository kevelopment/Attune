name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to build when creating a draft release
        required: false
        type: string
      create_draft:
        description: Create or refresh a draft GitHub Release at this workflow run's commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - name: Validate release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$CREATE_DRAFT" == "true" ]]; then
              if [[ ! "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo "Draft releases require a stable MAJOR.MINOR.PATCH version input (for example 0.0.2)." >&2
                exit 1
              fi
              echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
              echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
              echo "artifact_version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "draft=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "artifact_version=0.0.0-manual" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((alpha|beta|rc)(\.(0|[1-9][0-9]*))?))?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH with an optional alpha, beta, or rc suffix (for example v0.0.1-alpha)." >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "draft=false" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
          - id: macos-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - id: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - id: windows-amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: startsWith(matrix.goos, 'darwin')
        with:
          python-version: '3.12'

      - name: Build frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install Linux desktop dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libmtp-dev rpm

      - name: Install macOS MTP build dependencies
        if: startsWith(matrix.goos, 'darwin')
        run: brew install pkgconf

      - name: Install Windows C compiler
        if: matrix.goos == 'windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add Windows C compiler to PATH
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingw = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          if (!(Test-Path (Join-Path $mingw 'gcc.exe'))) { throw "MinGW GCC was not found at $mingw" }
          Add-Content $env:GITHUB_PATH $mingw

      - name: Fetch pinned Kindling helper
        if: matrix.goos != 'windows'
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: scripts/fetch-kindling.sh "$TARGET_GOOS" "$TARGET_GOARCH"

      - name: Fetch pinned Kindling helper (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: ./scripts/fetch-kindling.ps1 $env:TARGET_GOOS $env:TARGET_GOARCH

      - name: Build and package (macOS/Linux)
        if: matrix.goos != 'windows'
        env:
          VERSION: ${{ needs.validate.outputs.publish == 'true' && needs.validate.outputs.artifact_version || needs.validate.outputs.version }}
          CGO_ENABLED: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            scripts/build-release.sh "$VERSION" webkit2_41
          else
            scripts/build-release.sh "$VERSION"
          fi

      - name: Build and package (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.publish == 'true' && needs.validate.outputs.artifact_version || needs.validate.outputs.version }}
        run: ./scripts/build-release.ps1 -Version $env:VERSION

      - name: Lint
        run: mise run lint

      - name: Test
        run: mise run test

      - name: Verify packaged updater startup
        env:
          ATTUNE_UPDATER_TEST_APP: ${{ github.workspace }}/build/bin/${{ matrix.goos == 'darwin' && 'Attune.app/Contents/MacOS/Attune' || matrix.goos == 'windows' && 'Attune.exe' || 'Attune' }}
        run: go test ./internal/updater -run '^TestPackagedHelperStartup$' -count=1

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: package-${{ matrix.id }}-${{ needs.validate.outputs.artifact_version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, build]
    if: (github.event_name == 'push' && needs.validate.outputs.publish == 'true') || (github.event_name == 'workflow_dispatch' && needs.validate.outputs.draft == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: package-*-${{ needs.validate.outputs.artifact_version }}
          merge-multiple: true
          path: dist
      - name: Generate checksums and install notes
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.artifact_version }}
        working-directory: dist
        run: |
          for file in Attune-*; do
            case "$file" in
              *.tar.gz) base=${file%.tar.gz}; suffix=.tar.gz ;;
              *.zip) base=${file%.zip}; suffix=.zip ;;
              *.dmg) base=${file%.dmg}; suffix=.dmg ;;
              *) continue ;;
            esac
            case "$base" in *-"$RELEASE_VERSION") continue ;; esac
            mv -- "$file" "${base}-${RELEASE_VERSION}${suffix}"
          done
          sha256sum Attune-* > SHA256SUMS.txt
          cat > INSTALL.txt <<'EOF'
          Attune release packages

          macOS: open the DMG and drag Attune.app onto the Applications shortcut. The ZIP package is used for in-app updates. Downloads are ad-hoc signed and not Apple-notarized; follow Apple's Open Anyway instructions at https://support.apple.com/en-us/102445 if Gatekeeper blocks first launch.
          Linux amd64 and arm64: install the RPM or DEB package to add Attune and its desktop launcher; the package manager resolves GTK 3, WebKit2GTK 4.1, libmtp, and C runtime dependencies. MTP access may need a udev rule. USB mass-storage management needs lsblk, udisksctl, and working UDisks/polkit permissions.
          Windows amd64: experimental; Microsoft Edge WebView2 Runtime and PowerShell Storage CIM cmdlets are required. USB management requires a USB/removable volume with a drive letter and stable IDs. MTP uses Windows Portable Devices through the packaged helper.
          macOS packages bundle pinned libmtp/libusb runtimes. MTP support is experimental; report the model, firmware, OS, transport, and tested operation so compatibility can be verified.
          Verify downloads with SHA256SUMS.txt.
          EOF
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          RELEASE_DRAFT: ${{ needs.validate.outputs.draft }}
        run: |
          notes_file=".github/release-notes/${RELEASE_TAG#v}.md"
          if [[ -f "$notes_file" ]]; then
            cp "$notes_file" dist/release-notes.txt
          else
            printf 'Attune %s\n\n' "$RELEASE_TAG" > dist/release-notes.txt
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              printf 'This is an early prerelease.\n\n' >> dist/release-notes.txt
            fi
            printf 'See INSTALL.txt for platform requirements and support notes.\n' >> dist/release-notes.txt
          fi
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            remote_tag_commit=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { tag=$1 } END { print peeled ? peeled : tag }')
            if [[ -n "$remote_tag_commit" && "$remote_tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Refusing to create a draft for $RELEASE_TAG: the existing tag points at a different commit." >&2
              exit 1
            fi
            existing_release=$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish 2>/dev/null || true)
            if [[ -n "$existing_release" ]]; then
              existing_draft=$(jq -r '.isDraft' <<< "$existing_release")
              existing_target=$(jq -r '.targetCommitish' <<< "$existing_release")
              if [[ "$existing_draft" != "true" || "$existing_target" != "$GITHUB_SHA" ]]; then
                echo "Refusing to update $RELEASE_TAG: an existing release must be a draft for this exact commit." >&2
                exit 1
              fi
              gh release edit "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Attune $RELEASE_TAG" --notes-file dist/release-notes.txt
              gh release upload "$RELEASE_TAG" dist/Attune-* dist/SHA256SUMS.txt dist/INSTALL.txt --clobber
            else
              gh release create "$RELEASE_TAG" dist/Attune-* dist/SHA256SUMS.txt dist/INSTALL.txt \
                --draft --target "$GITHUB_SHA" --title "Attune $RELEASE_TAG" --notes-file dist/release-notes.txt
            fi
          elif [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            gh release create "$RELEASE_TAG" dist/Attune-* dist/SHA256SUMS.txt dist/INSTALL.txt \
              --verify-tag --prerelease --title "Attune $RELEASE_TAG" --notes-file dist/release-notes.txt
          else
            existing_release=$(gh release view "$RELEASE_TAG" --json isDraft 2>/dev/null || true)
            if [[ -n "$existing_release" ]]; then
              existing_draft=$(jq -r '.isDraft' <<< "$existing_release")
              if [[ "$existing_draft" == "false" ]]; then
                echo "$RELEASE_TAG is already public; preserving its immutable release assets."
                exit 0
              fi
              existing_target=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')
              if [[ "$existing_target" == "$GITHUB_SHA" ]]; then
                echo "$RELEASE_TAG is an existing draft for this exact commit; preserving its assets."
                exit 0
              fi
              echo "$RELEASE_TAG already has a draft for a different commit; refusing to overwrite it." >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" dist/Attune-* dist/SHA256SUMS.txt dist/INSTALL.txt \
              --verify-tag --latest --title "Attune $RELEASE_TAG" --notes-file dist/release-notes.txt
          fi
