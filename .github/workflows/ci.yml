name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  native-test:
    name: native-test / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-amd64
            runner: macos-15-intel
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux desktop dependencies
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows C compiler
        if: matrix.runner == 'windows-2025'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add Windows C compiler to PATH
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingw = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          if (!(Test-Path (Join-Path $mingw 'gcc.exe'))) { throw "MinGW GCC was not found at $mingw" }
          Add-Content $env:GITHUB_PATH $mingw

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Test
        run: mise run test

  test:
    name: test
    if: always()
    needs: [native-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all native test jobs
        env:
          NATIVE_TEST_RESULT: ${{ needs.native-test.result }}
        run: test "$NATIVE_TEST_RESULT" = success

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - run: mise run lint
