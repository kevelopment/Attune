name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  native-test:
    name: native-test / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-amd64
            runner: macos-15-intel
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux desktop dependencies
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libmtp-dev

      - name: Install macOS MTP build dependencies
        if: startsWith(matrix.runner, 'macos-')
        run: brew install pkgconf

      - name: Install Windows C compiler
        if: matrix.runner == 'windows-2025'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add Windows C compiler to PATH
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $mingw = Join-Path $env:MSYS2_LOCATION 'ucrt64/bin'
          if (!(Test-Path (Join-Path $mingw 'gcc.exe'))) { throw "MinGW GCC was not found at $mingw" }
          Add-Content $env:GITHUB_PATH $mingw

      - name: Compile Windows Portable Devices helper
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: ./scripts/build-wpd-helper.ps1

      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Locate Go caches (Unix)
        if: matrix.runner != 'windows-2025'
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Locate Go caches (Windows)
        if: matrix.runner == 'windows-2025'
        id: go-cache-windows
        shell: pwsh
        run: |
          "gocache=$(go env GOCACHE)" >> $env:GITHUB_OUTPUT
          "gomodcache=$(go env GOMODCACHE)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.runner != 'windows-2025'
        with:
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.runner == 'windows-2025'
        with:
          path: |
            ${{ steps.go-cache-windows.outputs.gocache }}
            ${{ steps.go-cache-windows.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-

      - name: Test
        run: mise run test

      - name: Compile Unix MTP bindings
        if: matrix.runner != 'windows-2025'
        env:
          CGO_ENABLED: "1"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            mtp_arch="$(go env GOARCH)"
            [ "$mtp_arch" != amd64 ] || mtp_arch=x86_64
            scripts/build-macos-mtp.sh "$mtp_arch"
            export PKG_CONFIG_PATH="$PWD/.cache/macos-mtp/$mtp_arch/lib/pkgconfig"
          fi
          go test -run '^$' -tags libmtp ./internal/device

  test:
    name: test
    if: always()
    needs: [native-test]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all native test jobs
        env:
          NATIVE_TEST_RESULT: ${{ needs.native-test.result }}
        run: test "$NATIVE_TEST_RESULT" = success

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libmtp-dev
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "gocache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run lint
