version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: Attune
  BIN_DIR: build/bin
  PACKAGE_MANAGER: npm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5183}}'

tasks:
  build:
    summary: Builds Attune for the current platform
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages Attune for the current platform
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the built Attune application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs Attune with live reload
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
